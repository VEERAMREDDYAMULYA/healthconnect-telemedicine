<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF4FA"/>
      <stop offset="100%" stop-color="#D6E8F7"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <!-- Dropshadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Bubble/Aura -->
  <circle cx="400" cy="400" r="320" fill="#F0F9FF" />
  <circle cx="400" cy="400" r="280" fill="#E0F2FE" />

  <!-- Shadow on the floor -->
  <ellipse cx="400" cy="680" rx="140" ry="20" fill="#CBD5E1" opacity="0.6"/>

  <!-- Body -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <path d="M280,500 L520,500 C564,500 600,536 600,580 L600,660 L200,660 L200,580 C200,536 236,500 280,500 Z" fill="url(#bodyGrad)"/>
    
    <!-- Chest / Apron details -->
    <path d="M300,500 L500,500 L480,660 L320,660 Z" fill="#FFFFFF"/>
    
    <!-- Medical Cross -->
    <path d="M380,540 L420,540 L420,560 L440,560 L440,600 L420,600 L420,620 L380,620 L380,600 L360,600 L360,560 L380,560 Z" fill="#10B981"/>

    <!-- Left Arm -->
    <path d="M240,520 Q160,560 180,640" stroke="url(#bodyGrad)" stroke-width="40" stroke-linecap="round" fill="none"/>
    <circle cx="185" cy="640" r="25" fill="#94A3B8"/> <!-- hand -->

    <!-- Right Arm (holding tablet) -->
    <path d="M560,520 Q640,560 580,600" stroke="url(#bodyGrad)" stroke-width="40" stroke-linecap="round" fill="none"/>
    <circle cx="580" cy="600" r="25" fill="#94A3B8"/> <!-- hand -->
  </g>

  <!-- Tablet -->
  <g transform="translate(560, 560)">
    <rect x="-60" y="-80" width="120" height="150" rx="10" fill="#334155"/>
    <rect x="-50" y="-70" width="100" height="130" rx="5" fill="#FFFFFF"/>
    <line x1="-30" y1="-50" x2="30" y2="-50" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <line x1="-30" y1="-30" x2="10" y2="-30" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <!-- Medical Chart Line -->
    <polyline points="-30,30 -10,30 0,10 10,40 20,20 30,30" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Neck -->
  <rect x="375" y="440" width="50" height="80" fill="#94A3B8"/>
  <rect x="360" y="450" width="80" height="20" rx="10" fill="#64748B"/>

  <!-- Head -->
  <g filter="url(#shadow)">
    <!-- Main Shell -->
    <rect x="250" y="220" width="300" height="240" rx="80" fill="url(#bodyGrad)"/>
    <!-- Screen Face -->
    <rect x="280" y="250" width="240" height="180" rx="40" fill="url(#screenGrad)"/>
    
    <!-- Eyes -->
    <path d="M 330,320 Q 350,290 370,320" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 430,320 Q 450,290 470,320" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Cheeks -->
    <circle cx="330" cy="350" r="15" fill="#38BDF8" opacity="0.3"/>
    <circle cx="470" cy="350" r="15" fill="#38BDF8" opacity="0.3"/>

    <!-- Happy Smile -->
    <path d="M 360,370 Q 400,410 440,370" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Antennas -->
    <rect x="220" y="300" width="30" height="60" rx="10" fill="#64748B"/>
    <rect x="550" y="300" width="30" height="60" rx="10" fill="#64748B"/>
    
    <!-- Top Antenna -->
    <line x1="400" y1="220" x2="400" y2="160" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="400" cy="150" r="16" fill="#10B981"/>
  </g>

  <!-- Stethoscope -->
  <g>
    <!-- Tubes -->
    <path d="M 280,500 C 260,600 540,600 520,500" stroke="#475569" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 400,587 L 400,640" stroke="#475569" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- V neck part -->
    <path d="M 310,480 L 280,500" stroke="#475569" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 490,480 L 520,500" stroke="#475569" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Earpieces -->
    <circle cx="310" cy="480" r="12" fill="#E2E8F0"/>
    <circle cx="490" cy="480" r="12" fill="#E2E8F0"/>
    <!-- Chestpiece -->
    <circle cx="400" cy="650" r="20" fill="#1E293B"/>
    <circle cx="400" cy="650" r="10" fill="#E2E8F0"/>
  </g>

</svg>
