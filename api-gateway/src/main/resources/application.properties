spring.application.name=api-gateway
server.port=8000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=practitioner-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://practitioner-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/practitioner-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1